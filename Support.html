<head>

}

.switch input:checked + .slider{

}

transform:translateX(24px);
}

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                <img src="https://zyphor.cc/Logo1.png">

            </div>

            <nav class="nav">
                <a class="item" href="#">🏠 Dashboard</a>
                <a class="item" href="#">👤 Profile</a>
                <a class="item" href="#">💬 Messages</a>
                <a class="item active" href="#">🎫 Support</a>
                <a class="item" href="#">⚙️ Settings</a>
            </nav>

        </aside>

        <div class="main">

            <header class="topbar">

                <div>
                    <h1>Support Center</h1>
                    <p style="margin-top:6px;color:#9aa4b2;">
                        Modern support dashboard layout
                    </p>
                </div>

<div class="profile">

    <label class="switchLabel">

        <span>Anonymous</span>

            <input type="checkbox" id="anonToggle">
            <span class="slider"></span>
        </label>

    </label>

        <div class="cardHeader">

<script>

const messageBox = document.getElementById("messageBox")
const fileInput = document.getElementById("fileInput")

const previewBar = document.getElementById("previewBar")
const chatMessages = document.getElementById("chatMessages")
const ticketHeader = document.getElementById("ticketHeader")

const userDisplay = document.getElementById("userDisplay")
const staffTitle = document.getElementById("staffTitle")

const anonToggle = document.getElementById("anonToggle")

let backend = null
let token = null
let user = null

let activeTicket = null

let selectedFile = null
let selectedFileUrl = null

let activeTicketSignature = ""

let loadingTickets = false
let loadingActive = false

async function getBackend(){

    const r = await fetch("server.txt")

    return (await r.text()).trim()

}

async function safeJson(res){

    const txt = await res.text()

    try{

        return JSON.parse(txt)

    }catch{

        return null

    }

}

function hasSupport(){

    return !!(
        user &&
        (
            user.permissions.support ||
            user.permissions.admin
        )
    )

}

function hasAdmin(){

    return !!(
        user &&
        user.permissions.admin
    )

}

function escapeHTML(text){

    return String(text ?? "").replace(/[&<>"']/g,m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"

    }[m]))

}

async function init(){

    backend = await getBackend()

    token = localStorage.getItem("Token")

    if(!token){

        location.href="login.html"

        return

    }

    const r = await fetch(

        backend+"/me",

        {
            headers:{
                Authorization:token
            }
        }

    )

    user = await safeJson(r)

    if(!user || user.error){

        location.href="login.html"

        return

    }

    userDisplay.textContent =
        "Logged in as: " + user.username

    if(hasSupport())
        staffTitle.style.display="block"

    if(hasAdmin())
        anonToggle.parentElement.style.display="flex"

    await loadTickets()

}

async function loadTickets(){

    if(loadingTickets) return

    loadingTickets = true

    try{

        const r = await fetch(

            backend + "/support/list",

            {
                headers:{
                    Authorization:token
                }
            }

        )

        const data = await safeJson(r) || {
            mine:[],
            all:[]
        }

        renderTicketList(
            Array.isArray(data.mine)
                ? data.mine
                : [],
            "myTickets"
        )

        if(hasSupport()){

            renderTicketList(

                Array.isArray(data.all)
                    ? data.all
                    : [],

                "allTickets"

            )

        }

    }

    catch(err){

        console.error(err)

    }

    loadingTickets = false

}

function renderTicketList(list,containerId){

    const container =
        document.getElementById(containerId)

    container.innerHTML = ""

    list.sort((a,b)=>{

        if(a.status!==b.status){

            return a.status==="open"
                ? -1
                : 1

        }

        return new Date(b.createdAt)
            -
            new Date(a.createdAt)

    })

    list.forEach(ticket=>{

        const unread =
            ticket.unread || 0

        const div =
            document.createElement("div")

        div.className="ticketItem"

        div.dataset.ticket=ticket.id

        div.innerHTML=`

            <b>${escapeHTML(ticket.title)}</b>

            ${
                unread>0
                ?

                `<span style="
                    float:right;
                    background:#ef4444;
                    color:white;
                    padding:3px 7px;
                    border-radius:999px;
                    font-size:11px;
                ">
                    ${unread}
                </span>`

                : ""

            }

            <br>

            <span class="${
                ticket.status==="open"
                    ? "ticketStatusOpen"
                    : "ticketStatusClosed"
            }">

                ${ticket.status.toUpperCase()}

            </span>

        `

        div.onclick=()=>{

            openTicket(ticket)

            history.replaceState(
                null,
                "",
                "#" + ticket.id
            )

        }

        container.appendChild(div)

    })

}

function getFileName(path){

    if(!path) return "file"

    const parts = String(path).split("/")

    return parts[parts.length-1] || "file"

}

function getExt(name){

    const clean = String(name||"")
        .split("?")[0]
        .toLowerCase()

    const i = clean.lastIndexOf(".")

    return i==-1 ? "" : clean.slice(i+1)

}

function isImageFile(file){

    const name = getFileName(file?.path||file?.name||"")

    const mime = String(
        file?.mime ||
        file?.type ||
        ""
    ).toLowerCase()

    const ext = getExt(name)

    return (

        mime.startsWith("image/")

        ||

        [

            "png",
            "jpg",
            "jpeg",
            "gif",
            "webp",
            "bmp",
            "svg"

        ].includes(ext)

    )

}

function isVideoFile(file){

    const name = getFileName(file?.path||file?.name||"")

    const mime = String(
        file?.mime||
        file?.type||
        ""
    ).toLowerCase()

    const ext = getExt(name)

    return (

        mime.startsWith("video/")

        ||

        [

            "mp4",
            "mov",
            "webm",
            "mkv",
            "avi",
            "m4v",
            "ogg"

        ].includes(ext)

    )

}

function renderAttachment(att){

    if(!att) return ""

    const path = att.path || ""

    const url = backend + "/uploads/" + path

    const name = getFileName(path)

    if(isImageFile(att)){

        return `

        <div style="margin-top:10px">

            <img

                src="${url}"

                style="
                    max-width:100%;
                    border-radius:12px;
                    border:1px solid rgba(255,255,255,.08)
                "

            >

        </div>

        `

    }

    if(isVideoFile(att)){

        return `

        <div style="margin-top:10px">

            <video

                controls

                src="${url}"

                style="
                    max-width:100%;
                    border-radius:12px;
                "

            ></video>

        </div>

        `

    }

    return `

        <div style="margin-top:10px">

            <a

                href="${url}"

                target="_blank"

                style="
                    color:#7ab7ff;
                "

            >

                📄 ${name}

            </a>

        </div>

    `

}

function formatMessage(text){

    return escapeHTML(text)

        .replace(

            /((https?:\/\/|www\.)[^\s<]+)/gi,

            url=>{

                let href=url

                if(!href.startsWith("http"))

                    href="https://"+href

                return `<a href="${href}" target="_blank">${url}</a>`

            }

        )

}

function openTicket(ticket){

    activeTicket = ticket

    ticketHeader.innerHTML = `

        <b>${escapeHTML(ticket.title)}</b>

        <br>

        <span style="color:${
            ticket.status==="open"
            ? "#22c55e"
            : "#ef4444"
        }">

            ${ticket.status.toUpperCase()}

        </span>

        ${ticket.locked ? " 🔒 Locked" : ""}

    `

    renderMessages(ticket)

}

function renderMessages(ticket){

    chatMessages.innerHTML = "";

    if(!ticket){

        chatMessages.innerHTML = `
            <div class="emptyChat">
                <div class="emptyIcon">💬</div>
                <h2>Select a ticket</h2>
                <p>Choose a ticket from the left to start viewing the conversation.</p>
            </div>
        `;

        return;

    }

    ticketTitle.textContent = ticket.title;

    ticketHeader.innerHTML = `
        <div class="ticketInfo">

            <div>

                <div class="ticketName">
                    ${escapeHTML(ticket.title)}
                </div>

                <div class="ticketStatus ${
                    ticket.status=="open"
                    ? "statusOpen"
                    : "statusClosed"
                }">

                    ${ticket.status.toUpperCase()}

                    ${
                        ticket.locked
                        ? " • LOCKED"
                        : ""
                    }

                </div>

            </div>

        </div>
    `;

    let lastDate = "";

    (ticket.messages || []).forEach(message=>{

        const date = new Date(message.time);

        const day = date.toLocaleDateString();

        if(day!==lastDate){

            lastDate=day;

            const sep=document.createElement("div");

            sep.className="dateDivider";

            sep.innerHTML=`
                <span>${day}</span>
            `;

            chatMessages.appendChild(sep);

        }

        const mine =
            message.author===user.username;

        const wrapper=document.createElement("div");

        wrapper.className=
            mine
            ? "messageRow me"
            : "messageRow";

        const bubble=document.createElement("div");

        bubble.className=
            mine
            ? "messageBubble me"
            : "messageBubble";

        bubble.innerHTML=`

            <div class="messageTop">

                <span class="messageAuthor">

                    ${escapeHTML(message.author)}

                </span>

                <span class="messageTime">

                    ${date.toLocaleTimeString([],{
                        hour:"2-digit",
                        minute:"2-digit"
                    })}

                </span>

            </div>

            ${
                message.text
                ?
                `<div class="messageText">

                    ${formatMessage(message.text)}

                </div>`
                :
                ""
            }

            ${
                message.attachment
                ?
                renderAttachment(message.attachment)
                :
                ""
            }

        `;

        wrapper.appendChild(bubble);

        chatMessages.appendChild(wrapper);

    });

    requestAnimationFrame(()=>{

        chatMessages.scrollTop=
            chatMessages.scrollHeight;

    });

}

function buildTicketSignature(ticket){

    if(!ticket) return ""

    return JSON.stringify(ticket)

}

async function refreshActiveTicket(){

    if(!activeTicket) return

    const r = await fetch(

        backend+"/support/list",

        {

            headers:{

                Authorization:token

            }

        }

    )

    const data = await safeJson(r)

    if(!data) return

    const tickets=[

        ...(data.mine||[]),

        ...(data.all||[])

    ]

    const updated=tickets.find(

        t=>t.id===activeTicket.id

    )

    if(!updated) return

    const sig=buildTicketSignature(updated)

    if(sig===activeTicketSignature)

        return

    activeTicketSignature=sig

    activeTicket=updated

    openTicket(updated)

}

async function sendMessage(){
    if(!activeTicket) return
    const msg=messageBox.value
    const form=new FormData()
    form.append("ticketId",activeTicket.id)
    form.append("message",msg)
    if(selectedFile) form.append("file",selectedFile)
    if(anonToggle.checked) form.append("anonymous",true)
    await fetch(backend+"/support/message",{
        method:"POST",
        headers:{Authorization:token},
        body:form
    })
    messageBox.value=""
    removePreview()
    await refreshActiveTicket()
}

async function submitTicket(){

    const title=ticketTitleInput.value.trim()
    const reason=ticketReasonInput.value.trim()

    if(!title || !reason){
        alert("Please enter a title and reason")
        return
    }

    await fetch(backend+"/support/create",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            Authorization:token
        },
        body:JSON.stringify({
            title:title,
            reason:reason
        })
    })

    closeTicketPopup()
    loadTickets()
}
