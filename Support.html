<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Support</title>
</head>
<body>

<div id="content"></div>

<script>
async function loadSupport(){
    try{
        const serverResponse=await fetch("/server.txt",{cache:"no-store"})
        const backendUrl=(await serverResponse.text()).trim().replace(/\/+$/,"")

        if(!backendUrl){
            throw new Error("No backend URL")
        }

        const response=await fetch(`${backendUrl}/url/Support`,{
            method:"GET"
        })

        if(!response.ok){
            throw new Error("Failed to load Support")
        }

        const html=await response.text()

        document.getElementById("content").innerHTML=html
    }catch{
        document.getElementById("content").innerText="Failed to load Support"
    }
}

loadSupport()
</script>

</body>
</html>
