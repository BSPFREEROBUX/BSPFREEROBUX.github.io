<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

<div id="content"></div>

<script>
async function loadLogin(){
    try{
        const serverResponse=await fetch("/server.txt",{cache:"no-store"})
        const backendUrl=(await serverResponse.text()).trim().replace(/\/+$/,"")

        if(!backendUrl){
            throw new Error("No backend URL")
        }

        const response=await fetch(`${backendUrl}/url/login`,{
            method:"GET"
        })

        if(!response.ok){
            throw new Error("Failed to load Login")
        }

        const html=await response.text()

        document.getElementById("content").innerHTML=html
    }catch(err){
        document.getElementById("content").innerText="Failed to load Login"
    }
}

loadLogin()
</script>

</body>
</html>
