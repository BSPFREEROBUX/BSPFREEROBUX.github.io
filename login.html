<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

<div id="content"></div>

<script>
async function loadLogin(){
    try{
        const serverResponse=await fetch("/server.txt")
        const backendUrl=(await serverResponse.text()).trim()

        if(!backendUrl){
            throw new Error("No backend URL")
        }

        const response=await fetch(`${backendUrl}/url`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                url:"login"
            })
        })

        const data=await response.json()

        if(!data.success){
            throw new Error("Failed to load Login")
        }

        document.getElementById("content").innerHTML=data.html
    }catch(err){
        document.getElementById("content").innerText="Failed to load Login"
    }
}

loadLogin()
</script>

</body>
</html>
