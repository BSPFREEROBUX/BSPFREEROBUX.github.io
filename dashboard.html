<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
</head>
<body>
<div id="content"></div>
<script>
async function loadDashboard(){
    try{
        const serverResponse=await fetch("/server.txt")
        const backendUrl=(await serverResponse.text()).trim()

        if(!backendUrl) throw new Error()

        const response=await fetch(`${backendUrl}/url`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                url:"dashboard"
            })
        })

        const data=await response.json()

        if(!data.success) throw new Error()

        document.getElementById("content").innerHTML=data.html
    }catch{
        document.getElementById("content").innerText="Failed to load Dashboard"
    }
}

loadDashboard()
</script>
</body>
</html>
