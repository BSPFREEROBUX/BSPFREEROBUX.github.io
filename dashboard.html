<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179004241080538" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Zyphor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;overflow:hidden}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.logo-stage{position:relative;width:min(90vw,720px,160vh);aspect-ratio:3/2;max-height:80vh;overflow:hidden;isolation:isolate;background:#000}
.logo-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;clip-path:inset(0 0 100% 0);pointer-events:none}
.logo-layer img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.logo-layer.visible{clip-path:inset(0)}
.logo-layer.wipe{z-index:2;animation:wipeDown .65s linear forwards}
@keyframes wipeDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@media(max-width:600px){.logo-stage{width:92vw;max-height:70vh}}
@media(prefers-reduced-motion:reduce){.logo-layer.wipe{animation-duration:.01s}}
</style>
</head>
<body>
<div class="loading" id="loadingScreen">
    <div class="logo-stage">
        <div class="logo-layer" id="loadOne"><img src="Load1.png" alt=""></div>
        <div class="logo-layer" id="loadTwo"><img src="Load2.png" alt=""></div>
        <div class="logo-layer" id="mainLogo"><img src="Logo1.png" alt=""></div>
    </div>
</div>
<script>
(function(){
    const loadOne=document.getElementById("loadOne");
    const loadTwo=document.getElementById("loadTwo");
    const mainLogo=document.getElementById("mainLogo");
    const phone=localStorage.getItem("Phone");
    const destination="https://zyphor.cc/"+(phone==="1"?"1dashboard.html":"0dashboard.html");
    const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function transition(from,to,delay){
        setTimeout(function(){
            to.className="logo-layer wipe";
            to.addEventListener("animationend",function(){
                from.className="logo-layer";
                to.className="logo-layer visible";
            },{once:true});
        },delay);
    }

    loadOne.className="logo-layer visible";

    if(reducedMotion){
        loadOne.className="logo-layer";
        mainLogo.className="logo-layer visible";
        setTimeout(function(){window.location.replace(destination)},350);
        return;
    }

    transition(loadOne,loadTwo,350);
    transition(loadTwo,mainLogo,1150);

    setTimeout(function(){
        window.location.replace(destination);
    },2100);
})();
</script>
</body>
</html>
