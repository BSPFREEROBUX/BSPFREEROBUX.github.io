<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyphor Dashboard</title>
</head>
<body>

<script>
async function loadDashboard(){
    try{
        const serverResponse=await fetch("/server.txt",{cache:"no-store"})

        if(!serverResponse.ok){
            throw new Error("Failed to load server.txt")
        }

        const backendUrl=(await serverResponse.text()).trim().replace(/\/+$/,"")

        if(!backendUrl){
            throw new Error("No backend URL")
        }

        window.location.href=backendUrl+"/url/dashboard"
    }catch(err){
        document.body.innerHTML=`
            <div style="
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#08090f;
                color:white;
                font-family:Arial,sans-serif;
                text-align:center;
                padding:20px;
            ">
                <div>
                    <h2>Failed to load Dashboard</h2>
                    <p style="color:#888">${err.message}</p>
                </div>
            </div>
        `
    }
}

loadDashboard()
</script>

</body>
</html>
