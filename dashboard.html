<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyphor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;overflow:hidden}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.logo-stage{position:relative;width:min(72vw,420px);height:min(72vw,420px);max-width:75vh;max-height:75vh}
.logo-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none}
.logo-stage img.visible{opacity:1;clip-path:inset(0 0 0 0)}
.logo-stage img.wipe{opacity:1;clip-path:inset(0 0 100% 0);animation:wipeDown 2.6s linear forwards}
@keyframes wipeDown{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}
@media(max-width:600px){.logo-stage{width:min(78vw,360px);height:min(78vw,360px)}}
@media(prefers-reduced-motion:reduce){.logo-stage img.wipe{animation-duration:.1s}}
</style>
</head>
<body>
<div class="loading" id="loadingScreen">
    <div class="logo-stage">
        <img id="loadOne" src="Load1.png" alt="">
        <img id="loadTwo" src="Load2.png" alt="">
        <img id="mainLogo" src="Logo1.png" alt="">
    </div>
</div>
<script>
(function(){
    const loadOne=document.getElementById("loadOne");
    const loadTwo=document.getElementById("loadTwo");
    const mainLogo=document.getElementById("mainLogo");
    const phone=localStorage.getItem("Phone");
    const page=phone==="1"?"1dashboard.html":"0dashboard.html";
    const destination="https://zyphor.cc/"+page;

    loadOne.className="visible";

    setTimeout(function(){
        loadTwo.className="wipe";
    },1400);

    setTimeout(function(){
        mainLogo.className="wipe";
    },4400);

    setTimeout(function(){
        window.location.replace(destination);
    },7100);
})();
</script>
</body>
</html>
