<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyphor Dashboard</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179004241080538"
        crossorigin="anonymous"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    overflow: hidden;
}

.screen {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.loading {
    flex-direction: column;
    gap: 24px;
}

.spinner {
    width: 54px;
    height: 54px;
    border: 5px solid rgba(255,255,255,.12);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

.loading-text {
    font-size: 18px;
    color: #aaa;
    text-align: center;
}

.progress {
    width: min(420px, 90%);
    height: 5px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #fff;
    transition: width .3s ease;
}

.video-screen {
    display: none;
    flex-direction: column;
    gap: 22px;
}

.video-wrapper {
    width: min(900px, 100%);
    border-radius: 18px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 20px 70px rgba(0,0,0,.5);
}

video {
    display: block;
    width: 100%;
    max-height: 75vh;
    background: #000;
}

.video-title {
    font-size: 18px;
    color: #aaa;
    text-align: center;
}

.actions {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px 30px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.continue {
    background: #fff;
    color: #000;
    opacity: .35;
    pointer-events: none;
    transition: .2s;
}

.continue.ready {
    opacity: 1;
    pointer-events: auto;
}

.skip {
    background: #222;
    color: #fff;
    border: 1px solid #444;
}

.skip:hover {
    background: #333;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="screen loading" id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Initializing secure session...</div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<div class="screen video-screen" id="videoScreen">
    <div class="video-title" id="videoTitle"></div>

    <div class="video-wrapper">
        <video id="introVideo" playsinline preload="auto"></video>
    </div>

    <div class="actions">
        <button class="continue" id="continueButton">Continue</button>
        <button class="skip" id="skipButton">Skip</button>
    </div>
</div>

<script>
(function() {
    const loadingScreen = document.getElementById("loadingScreen");
    const loadingText = document.getElementById("loadingText");
    const progressBar = document.getElementById("progressBar");
    const videoScreen = document.getElementById("videoScreen");
    const video = document.getElementById("introVideo");
    const videoTitle = document.getElementById("videoTitle");
    const continueButton = document.getElementById("continueButton");
    const skipButton = document.getElementById("skipButton");

    const phone = localStorage.getItem("Phone");
    const page = phone === "1" ? "1dashboard.html" : "0dashboard.html";
    const destination = "https://zyphor.cc/" + page;

    const videos = [
        {
            video: "Images/ssstik.io_1791315223498.mp4",
            title: "Preparing your Zyphor session..."
        },
        ...Array.from({ length: 13 }, (_, i) => ({
            video: "Images/s" + (i + 2) + ".mp4",
            title: "Loading Zyphor stage " + (i + 2) + "..."
        }))
    ];

    const loadingStages = [
        ["Initializing secure session...", "Connecting to Zyphor...", "Checking session information...", "Preparing your dashboard..."],
        ["Processing session data...", "Synchronizing account information...", "Checking dashboard configuration...", "Preparing interface..."],
        ["Verifying dashboard access...", "Loading user configuration...", "Preparing your experience...", "Synchronizing services..."],
        ["Checking security configuration...", "Loading secure resources...", "Preparing account services...", "Finalizing checks..."],
        ["Loading dashboard components...", "Synchronizing services...", "Preparing navigation...", "Almost finished..."],
        ["Checking session integrity...", "Loading interface resources...", "Preparing your workspace...", "Continuing initialization..."],
        ["Synchronizing account state...", "Loading preferences...", "Preparing dashboard data...", "Almost ready..."],
        ["Loading remaining resources...", "Checking configuration...", "Preparing final components...", "Continuing..."],
        ["Optimizing dashboard...", "Loading user interface...", "Synchronizing services...", "Almost there..."],
        ["Preparing final resources...", "Checking account state...", "Loading dashboard...", "Finalizing..."],
        ["Completing initialization...", "Loading remaining components...", "Preparing your session...", "Almost done..."],
        ["Performing final checks...", "Loading final resources...", "Preparing dashboard access...", "Finishing..."],
        ["Finalizing your session...", "Preparing dashboard navigation...", "Completing setup...", "Ready soon..."],
        ["Final dashboard preparation...", "Finishing initialization...", "Loading final interface...", "Redirect preparation complete..."]
    ];

    const skipCode = "SominRules";
    let currentStage = 0;
    let videoFinished = false;
    let maxWatched = 0;
    let waitingForPlay = false;
    let loadingTimer = null;

    function hasSkipPermission() {
        return localStorage.getItem("ZyphorSkipRules") === skipCode;
    }

    function saveSkipPermission() {
        localStorage.setItem("ZyphorSkipRules", skipCode);
    }

    function runLoading(stage) {
        loadingScreen.style.display = "flex";
        videoScreen.style.display = "none";

        const messages = loadingStages[Math.min(stage, loadingStages.length - 1)];
        const duration = Math.random() * 800 + 400;
        const start = Date.now();
        let messageIndex = 0;

        loadingText.textContent = messages[0];
        progressBar.style.width = "0%";

        clearInterval(loadingTimer);

        loadingTimer = setInterval(function() {
            const elapsed = Date.now() - start;
            const percentage = Math.min((elapsed / duration) * 100, 100);

            progressBar.style.width = percentage + "%";

            const newIndex = Math.min(
                Math.floor((elapsed / duration) * messages.length),
                messages.length - 1
            );

            if (newIndex !== messageIndex) {
                messageIndex = newIndex;
                loadingText.textContent = messages[messageIndex];
            }

            if (elapsed >= duration) {
                clearInterval(loadingTimer);
                progressBar.style.width = "100%";
                showVideo();
            }
        }, 30);
    }

    function showVideo() {
        loadingScreen.style.display = "none";
        videoScreen.style.display = "flex";

        videoFinished = false;
        maxWatched = 0;
        waitingForPlay = false;

        continueButton.classList.remove("ready");
        videoTitle.textContent = videos[currentStage].title;

        video.pause();
        video.removeAttribute("src");
        video.load();

        video.src = videos[currentStage].video;
        video.load();

        video.play().catch(function() {
            waitingForPlay = true;
            videoTitle.textContent = videos[currentStage].title + " Tap the video to begin.";
        });
    }

    function nextStage() {
        currentStage++;

        if (currentStage >= videos.length) {
            window.location.replace(destination);
            return;
        }

        continueButton.classList.remove("ready");
        runLoading(currentStage);
    }

    video.addEventListener("click", function() {
        if (waitingForPlay) {
            waitingForPlay = false;
            video.play().catch(function() {});
        }
    });

    video.addEventListener("timeupdate", function() {
        if (!video.duration || !isFinite(video.duration)) {
            return;
        }

        if (video.currentTime > maxWatched + 0.7) {
            video.currentTime = maxWatched;
            return;
        }

        if (video.currentTime > maxWatched) {
            maxWatched = video.currentTime;
        }

        if (video.currentTime >= video.duration - 0.15) {
            videoFinished = true;
            continueButton.classList.add("ready");
        }
    });

    video.addEventListener("seeking", function() {
        if (video.currentTime > maxWatched + 0.7) {
            video.currentTime = maxWatched;
        }
    });

    video.addEventListener("ended", function() {
        videoFinished = true;
        maxWatched = video.duration;
        continueButton.classList.add("ready");
    });

    continueButton.addEventListener("click", function() {
        if (!videoFinished) {
            return;
        }

        nextStage();
    });

    skipButton.addEventListener("click", function() {
        if (!hasSkipPermission()) {
            const code = prompt("Enter the skip code:");

            if (code !== skipCode) {
                alert("Invalid code.");
                return;
            }

            saveSkipPermission();
        }

        video.pause();
        clearInterval(loadingTimer);
        nextStage();
    });

    runLoading(0);
})();
</script>

</body>
</html>
