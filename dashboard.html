<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyphor Dashboard</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5179004241080538"
        crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;overflow:hidden}
.screen{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loading{position:fixed;inset:0;z-index:10;padding:0;background:#000;overflow:hidden}
.logo-stage{position:relative;width:min(72vw,420px);height:min(72vw,420px);max-width:75vh;max-height:75vh}
.logo-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.logo-stage img.visible{opacity:1}
.logo-stage img.wipe{opacity:1;clip-path:inset(0 0 100% 0);animation:wipeDown 2.2s ease-in-out forwards}
.logo-stage img.fade{animation:logoFade 1.2s ease forwards}
@keyframes wipeDown{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}
@keyframes logoFade{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
.video-screen{display:none;flex-direction:column;gap:22px}
.video-wrapper{width:min(900px,100%);border-radius:18px;overflow:hidden;background:#111;box-shadow:0 20px 70px rgba(0,0,0,.5)}
video{display:block;width:100%;max-height:75vh;background:#000}
.video-title{font-size:18px;color:#aaa;text-align:center}
.actions{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:14px 30px;font-size:16px;font-weight:700;cursor:pointer}
.continue{background:#fff;color:#000;opacity:.35;pointer-events:none;transition:.2s}
.continue.ready{opacity:1;pointer-events:auto}
@media(max-width:600px){.screen{padding:14px}.logo-stage{width:min(78vw,360px);height:min(78vw,360px)}.video-wrapper{border-radius:12px}}
@media(prefers-reduced-motion:reduce){.logo-stage img.wipe{animation-duration:.1s}.logo-stage img.fade{animation-duration:.1s}}
</style>
</head>

<body>

<div class="screen loading" id="loadingScreen">
    <div class="logo-stage">
        <img id="loadOne" src="Load1.png" alt="">
        <img id="loadTwo" src="Load2.png" alt="">
        <img id="mainLogo" src="Logo1.png" alt="">
    </div>
</div>

<div class="screen video-screen" id="videoScreen">
    <div class="video-title" id="videoTitle"></div>

    <div class="video-wrapper">
        <video id="introVideo" playsinline preload="auto"></video>
    </div>

    <div class="actions">
        <button class="continue" id="continueButton">Continue</button>
    </div>
</div>

<script>
(function() {
    const loadingScreen = document.getElementById("loadingScreen");
    const loadOne = document.getElementById("loadOne");
    const loadTwo = document.getElementById("loadTwo");
    const mainLogo = document.getElementById("mainLogo");
    const videoScreen = document.getElementById("videoScreen");
    const video = document.getElementById("introVideo");
    const videoTitle = document.getElementById("videoTitle");
    const continueButton = document.getElementById("continueButton");

    const phone = localStorage.getItem("Phone");
    const page = phone === "1" ? "1dashboard.html" : "0dashboard.html";
    const destination = "https://zyphor.cc/" + page;

    const videos = [
        {
            video: "Images/ssstik.io_1791315223498.mp4",
            title: "Preparing your Zyphor session..."
        },
        ...Array.from({ length: 13 }, (_, i) => ({
            video: "Images/s" + (i + 2) + ".mp4",
            title: "Loading Zyphor stage " + (i + 2) + "..."
        }))
    ];

    let currentStage = 0;
    let videoFinished = false;
    let maxWatched = 0;
    let waitingForPlay = false;
    let introStarted = false;

    function runLoading() {
        loadingScreen.style.display = "flex";
        videoScreen.style.display = "none";
        loadOne.className = "visible";
        loadTwo.className = "";
        mainLogo.className = "";
        loadOne.style.opacity = "1";
        loadTwo.style.opacity = "0";
        mainLogo.style.opacity = "0";

        setTimeout(function() {
            loadTwo.className = "wipe";
        }, 250);

        setTimeout(function() {
            loadOne.style.opacity = "0";
            loadTwo.className = "visible";
        }, 2450);

        setTimeout(function() {
            mainLogo.className = "fade";
        }, 2700);

        setTimeout(function() {
            loadOne.style.opacity = "0";
            loadTwo.style.opacity = "0";
            mainLogo.style.opacity = "1";
        }, 3950);

        setTimeout(function() {
            if (!introStarted) {
                introStarted = true;
                showVideo();
            }
        }, 4400);
    }

    function showVideo() {
        loadingScreen.style.display = "none";
        videoScreen.style.display = "flex";

        videoFinished = false;
        maxWatched = 0;
        waitingForPlay = false;

        continueButton.classList.remove("ready");
        videoTitle.textContent = videos[currentStage].title;

        video.pause();
        video.removeAttribute("src");
        video.load();

        video.src = videos[currentStage].video;
        video.load();

        video.play().catch(function() {
            waitingForPlay = true;
            videoTitle.textContent = videos[currentStage].title + " Tap the video to begin.";
        });
    }

    function nextStage() {
        currentStage++;

        if (currentStage >= videos.length) {
            window.location.replace(destination);
            return;
        }

        continueButton.classList.remove("ready");
        showVideo();
    }

    video.addEventListener("click", function() {
        if (waitingForPlay) {
            waitingForPlay = false;
            video.play().catch(function() {});
        }
    });

    video.addEventListener("timeupdate", function() {
        if (!video.duration || !isFinite(video.duration)) {
            return;
        }

        if (video.currentTime > maxWatched + 0.7) {
            video.currentTime = maxWatched;
            return;
        }

        if (video.currentTime > maxWatched) {
            maxWatched = video.currentTime;
        }

        if (video.currentTime >= video.duration - 0.15) {
            videoFinished = true;
            continueButton.classList.add("ready");
        }
    });

    video.addEventListener("seeking", function() {
        if (video.currentTime > maxWatched + 0.7) {
            video.currentTime = maxWatched;
        }
    });

    video.addEventListener("ended", function() {
        videoFinished = true;
        maxWatched = video.duration;
        continueButton.classList.add("ready");
    });

    continueButton.addEventListener("click", function() {
        if (!videoFinished) {
            return;
        }

        nextStage();
    });


    runLoading();
})();
</script>

</body>
</html>
