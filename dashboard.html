<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyphor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;overflow:hidden}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.logo-stage{position:relative;width:min(90vw,720px,160vh);aspect-ratio:3/2;max-height:80vh;overflow:hidden;isolation:isolate}
.logo-stage img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:center;opacity:0;clip-path:inset(0 0 100% 0);pointer-events:none}
.logo-stage img.visible{opacity:1;clip-path:inset(0 0 0 0)}
.logo-stage img.wipe{z-index:2;opacity:1;animation:wipeDown 2.6s linear forwards}
@keyframes wipeDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@media(max-width:600px){.logo-stage{width:92vw;max-height:70vh}}
@media(prefers-reduced-motion:reduce){.logo-stage img.wipe{animation-duration:.1s}}
</style>
</head>
<body>
<div class="loading" id="loadingScreen">
    <div class="logo-stage">
        <img id="loadOne" src="Load1.png" alt="">
        <img id="loadTwo" src="Load2.png" alt="">
        <img id="mainLogo" src="Logo1.png" alt="">
    </div>
</div>
<script>
(function(){
    const loadOne=document.getElementById("loadOne");
    const loadTwo=document.getElementById("loadTwo");
    const mainLogo=document.getElementById("mainLogo");
    const phone=localStorage.getItem("Phone");
    const page=phone==="1"?"1dashboard.html":"0dashboard.html";
    const destination="https://zyphor.cc/"+page;

    function transition(from,to,delay){
        setTimeout(function(){
            to.className="wipe";
            to.addEventListener("animationend",function(){
                from.className="";
                to.className="visible";
            },{once:true});
        },delay);
    }

    loadOne.className="visible";
    transition(loadOne,loadTwo,1400);
    transition(loadTwo,mainLogo,4400);
    setTimeout(function(){window.location.replace(destination)},7300);
})();
</script>
</body>
</html>
