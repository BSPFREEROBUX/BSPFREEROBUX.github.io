<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DMS</title>
</head>
<body>

<div id="content"></div>

<script>
async function loadDMS(){
    try{
        const serverResponse=await fetch("/server.txt")
        const backendUrl=(await serverResponse.text()).trim()

        if(!backendUrl){
            throw new Error("No backend URL")
        }

        const response=await fetch(`${backendUrl}/url`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                url:"0DMS"
            })
        })

        const data=await response.json()

        if(!data.success){
            throw new Error("Failed to load DMS")
        }

        document.getElementById("content").innerHTML=data.html
    }catch(err){
        document.getElementById("content").innerText="Failed to load DMS"
    }
}

loadDMS()
</script>

</body>
</html>
