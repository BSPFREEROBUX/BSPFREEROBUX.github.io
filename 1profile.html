<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profile</title>
</head>
<body>

<div id="content"></div>

<script>
async function loadProfile(){
    try{
        const serverResponse=await fetch("/server.txt")
        const backendUrl=(await serverResponse.text()).trim()

        if(!backendUrl){
            throw new Error("No backend URL")
        }

        const response=await fetch(`${backendUrl}/url`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                url:"1profile"
            })
        })

        const data=await response.json()

        if(!data.success){
            throw new Error("Failed to load profile")
        }

        document.getElementById("content").innerHTML=data.html
    }catch(err){
        document.getElementById("content").innerText="Failed to load profile"
    }
}

loadProfile()
</script>

</body>
</html>
