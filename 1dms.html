<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zyphor Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at top,#18284f 0,#0b0d14 42%,#06070b 100%);color:#fff}
body{display:flex}
button,input,textarea{font:inherit}
#app{width:100%;height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto;background:rgba(8,10,16,.62);box-shadow:0 0 80px rgba(0,0,0,.35)}
.header{padding:calc(14px + env(safe-area-inset-top)) 14px 12px;background:rgba(14,18,29,.82);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:24px;font-weight:800;letter-spacing:-.6px}.home{width:42px;height:42px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-size:18px}
.search{margin-top:14px;display:flex;gap:8px}.search input{flex:1;min-width:0;height:46px;border:1px solid rgba(255,255,255,.07);outline:none;background:rgba(255,255,255,.06);border-radius:14px;padding:0 14px;color:#fff;font-size:16px}.search input:focus{border-color:rgba(0,213,255,.6);box-shadow:0 0 0 3px rgba(0,213,255,.08)}.search button{width:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#00bfe9,#6755f5);color:#fff;font-size:23px;font-weight:700}
.requests{margin-top:10px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px 14px}.requests span:first-child{font-size:14px;font-weight:700}.badge,.unread{min-width:23px;height:23px;padding:0 7px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:#ff4d5d}
#requestList{max-height:210px;overflow:auto}
.friendList{flex:1;overflow:auto;padding:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom));scrollbar-width:none}.friendList::-webkit-scrollbar,.messages::-webkit-scrollbar{display:none}
.sectionLabel{font-size:11px;font-weight:800;letter-spacing:1.2px;color:#8290aa;text-transform:uppercase;padding:9px 6px 7px}
.friend{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;background:linear-gradient(135deg,rgba(28,34,50,.86),rgba(17,20,30,.86));border:1px solid rgba(255,255,255,.055);border-radius:18px;cursor:pointer;transition:.18s}.friend:active{transform:scale(.985);background:rgba(255,255,255,.1)}.friend.pinned{background:linear-gradient(135deg,rgba(0,213,255,.12),rgba(105,73,255,.14),rgba(25,29,43,.92));border-color:rgba(0,213,255,.22)}
.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#00c6f5,#7558f6);font-size:20px;font-weight:800;position:relative;box-shadow:0 5px 20px rgba(0,0,0,.2)}.online{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#31d47c;border:3px solid #202536}
.info{flex:1;min-width:0}.name{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:4px;color:#96a1b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.unread{background:#5f62ff}.pinBtn{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.06);color:#9eabc0;font-size:16px;flex:0 0 auto}.pinBtn.pinned{color:#00d5ff;background:rgba(0,213,255,.11)}
.requestActions{display:flex;gap:6px}.mini{width:38px;height:38px;border:0;border-radius:12px;color:#fff;font-size:17px}.accept{background:#23b46b}.decline{background:#ef4d5c}
.empty{text-align:center;padding:46px 20px;color:#8793a8;line-height:1.6}.empty strong{display:block;color:#fff;font-size:17px;margin-bottom:5px}
.chat{position:fixed;inset:0;background:radial-gradient(circle at top,#17264c,#090b11 50%);display:none;flex-direction:column;z-index:20;max-width:900px;margin:auto}
.chatHeader{min-height:68px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;background:rgba(13,17,27,.86);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px)}.back{width:42px;height:42px;border:0;border-radius:14px;background:rgba(255,255,255,.07);color:#fff;font-size:21px}.chatName{font-size:16px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages{flex:1;overflow:auto;padding:16px 12px 24px}.row{display:flex;margin-bottom:10px}.me{justify-content:flex-end}.bubble{max-width:min(82%,620px);padding:11px 13px;border-radius:18px;background:#202737;line-height:1.45;font-size:14px;word-break:break-word;box-shadow:0 4px 18px rgba(0,0,0,.12)}.me .bubble{background:linear-gradient(135deg,#5263f4,#7958e8)}.bubble img{width:100%;border-radius:12px;margin-top:9px;display:block}.time{margin-top:5px;font-size:10px;opacity:.58}.receipt{font-size:10px;opacity:.65;margin-top:4px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(14,18,28,.9);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}.circle{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:15px;background:rgba(255,255,255,.07);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}.send{background:linear-gradient(135deg,#00bfe9,#6954f4)}.composer textarea{flex:1;min-height:46px;max-height:130px;border:1px solid rgba(255,255,255,.07);outline:none;resize:none;background:rgba(255,255,255,.06);border-radius:17px;color:#fff;padding:13px 14px;font-size:16px}
@media(min-width:600px){.header{padding-left:22px;padding-right:22px}.friendList{padding:18px 22px}.friend{padding:14px}.chat{border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}}
</style>
</head>
<body>
<div id="app">
<div class="header">
<div class="topbar"><div class="title">Messages</div><button class="home" onclick="location.href='dashboard.html'">⌂</button></div>
<div class="search"><input id="searchUser" placeholder="Search username"><button id="addFriendBtn">+</button></div>
<div class="requests" id="requestsButton"><span>Friend Requests</span><div class="badge" id="requestCount">0</div></div>
<div id="requestList"></div>
</div>
<div class="friendList" id="friendList"></div>
</div>

<div class="chat" id="chat">
<div class="chatHeader"><button class="back" id="backButton">←</button><div class="chatName" id="chatTitle" style="flex:1">Select a friend</div><button class="back" onclick="location.href='dashboard.html'">⌂</button></div>
<div class="messages" id="messages"></div>
<div class="composer">
<input type="file" id="imagePicker" accept="image/*" multiple hidden>
<label for="imagePicker" class="circle">📷</label>
<textarea id="messageBox" placeholder="Message"></textarea>
<button class="circle send" id="sendBtn">➤</button>
</div>
</div>

<script>
let backend=null,token=null,myName="",state={friends:[],chats:[],incomingRequests:[]},activeFriend="",lastChatJSON=""
const friendList=document.getElementById("friendList"),requestList=document.getElementById("requestList"),requestCount=document.getElementById("requestCount"),chat=document.getElementById("chat"),chatTitle=document.getElementById("chatTitle"),messages=document.getElementById("messages"),messageBox=document.getElementById("messageBox"),imagePicker=document.getElementById("imagePicker"),sendBtn=document.getElementById("sendBtn"),searchUser=document.getElementById("searchUser"),addFriendBtn=document.getElementById("addFriendBtn"),backButton=document.getElementById("backButton")
function getPinned(){try{return JSON.parse(localStorage.getItem("zyphorPinnedDMs")||"[]")}catch{return[]}}
function setPinned(list){localStorage.setItem("zyphorPinnedDMs",JSON.stringify([...new Set(list)]))}
function isPinned(friend){return getPinned().includes(friend)}
function togglePin(friend,event){event.stopPropagation();let pins=getPinned();pins=pins.includes(friend)?pins.filter(x=>x!==friend):[...pins,friend];setPinned(pins);renderFriends()}
async function getBackend(){const r=await fetch("server.txt");return(await r.text()).trim()}
async function safeJson(r){const t=await r.text();try{return JSON.parse(t)}catch{return null}}
async function api(path,options={}){const headers=new Headers(options.headers||{});headers.set("Authorization",localStorage.getItem("Token"));return fetch(backend+path,{...options,headers})}
async function trackPage(page){if(!localStorage.getItem("Token"))return;await fetch(backend+"/track/page",{method:"POST",headers:{"Content-Type":"application/json",Authorization:localStorage.getItem("Token")},body:JSON.stringify({page})})}
async function refreshState(){const r=await api("/dms/state"),data=await safeJson(r);if(!data)return;state=data;state.friends||=[];state.chats||=[];state.incomingRequests||=[];renderRequests();renderFriends();if(activeFriend)await openChat(activeFriend,false)}
function renderRequests(){requestCount.textContent=state.incomingRequests.length;requestList.innerHTML="";if(!state.incomingRequests.length){requestList.style.display="none";return}requestList.style.display="block";state.incomingRequests.forEach(r=>{const d=document.createElement("div");d.className="friend";d.innerHTML=`<div class="avatar">${escapeHTML(r.from.charAt(0).toUpperCase())}</div><div class="info"><div class="name">${escapeHTML(r.from)}</div><div class="preview">Friend request</div></div><div class="requestActions"><button class="mini accept">✓</button><button class="mini decline">✕</button></div>`;d.querySelector(".accept").onclick=e=>{e.stopPropagation();acceptRequest(r.id,r.from)};d.querySelector(".decline").onclick=e=>{e.stopPropagation();declineRequest(r.id)};requestList.appendChild(d)})}
function renderFriends(){friendList.innerHTML="";if(!state.friends.length){friendList.innerHTML=`<div class="empty"><strong>No friends yet</strong>Search for a username above to start messaging.</div>`;return}const pins=getPinned();const sorted=[...state.friends].sort((a,b)=>{const ap=pins.includes(a),bp=pins.includes(b);if(ap!==bp)return ap?-1:1;const aa=state.chats.find(c=>c.with===a)||{},bb=state.chats.find(c=>c.with===b)||{};return(bb.unread||0)-(aa.unread||0)});let shownPinned=false,shownOthers=false;sorted.forEach(friend=>{const pinned=pins.includes(friend);if(pinned&&!shownPinned){friendList.insertAdjacentHTML("beforeend",`<div class="sectionLabel">Pinned</div>`);shownPinned=true}if(!pinned&&!shownOthers){friendList.insertAdjacentHTML("beforeend",`<div class="sectionLabel">${shownPinned?"Messages":"Messages"}</div>`);shownOthers=true}const c=state.chats.find(x=>x.with===friend)||{},d=document.createElement("div");d.className="friend"+(pinned?" pinned":"");d.innerHTML=`<div class="avatar">${escapeHTML(friend.charAt(0).toUpperCase())}<div class="online"></div></div><div class="info"><div class="name">${escapeHTML(friend)}</div><div class="preview">${c.lastAuthor?escapeHTML(c.lastAuthor+": "+(c.lastMessage||"")):"No messages yet"}</div></div>${c.unread?`<div class="unread">${c.unread}</div>`:""}<button class="pinBtn ${pinned?"pinned":""}" title="Pin">${pinned?"📌":"⌖"}</button>`;d.onclick=()=>openChat(friend);d.querySelector(".pinBtn").onclick=e=>togglePin(friend,e);friendList.appendChild(d)})}
async function openChat(friend,markSeen=true){activeFriend=friend;const r=await api("/dms/chat?with="+encodeURIComponent(friend)),data=await safeJson(r);if(!data||data.error){if(data?.error)alert(data.error);return}chat.style.display="flex";chatTitle.textContent=friend;const j=JSON.stringify(data.chat);if(j!==lastChatJSON){lastChatJSON=j;renderMessages(data.chat)}if(markSeen)await api("/dms/seen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:friend})})}
function escapeHTML(t){return String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function formatTime(t){try{return new Date(t).toLocaleString()}catch{return""}}
function renderMessages(data){const wasNearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<120;messages.innerHTML="";if(!data.messages.length){messages.innerHTML=`<div class="empty"><strong>No messages yet</strong>Say hello.</div>`;return}data.messages.forEach(m=>{const me=m.author===myName,row=document.createElement("div");row.className="row "+(me?"me":"them");const other=data.users.find(u=>u!==myName),read=data.lastRead?.[other],receipt=me?`<div class="receipt">${read&&new Date(read)>=new Date(m.time)?"✓ Read":"✓ Sent"}</div>`:"";row.innerHTML=`<div class="bubble">${!me?`<div style="font-size:11px;opacity:.7;margin-bottom:4px">${escapeHTML(m.author)}</div>`:""}<div>${escapeHTML(m.text)}</div>${(m.images||[]).map(i=>`<img src="${backend}${i.url}" onclick="window.open('${backend}${i.url}','_blank')">`).join("")}<div class="time">${formatTime(m.time)}</div>${receipt}</div>`;messages.appendChild(row)});requestAnimationFrame(()=>{if(wasNearBottom)messages.scrollTop=messages.scrollHeight})}
async function sendMessage(){if(!activeFriend)return;const text=messageBox.value.trim();if(!text&&!imagePicker.files.length)return;const form=new FormData();form.append("chatId",activeFriend);form.append("message",text);for(const f of imagePicker.files)form.append("images",f);const r=await api("/dms/send",{method:"POST",body:form}),data=await safeJson(r);if(!data)return;if(data.error){alert(data.error);return}messageBox.value="";imagePicker.value="";await openChat(activeFriend,false);await refreshState()}
sendBtn.onclick=sendMessage
messageBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}})
backButton.onclick=()=>{chat.style.display="none";activeFriend="";lastChatJSON=""}
addFriendBtn.onclick=addFriend
searchUser.addEventListener("keydown",e=>{if(e.key==="Enter")addFriend()})
async function addFriend(){const username=searchUser.value.trim();if(!username)return;const r=await api("/friends/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})}),data=await safeJson(r);if(!data)return;if(data.success){searchUser.value="";refreshState();return}alert(data.error)}
async function acceptRequest(requestId,from){const r=await api("/friends/accept",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId})}),data=await safeJson(r);if(!data)return;await refreshState();openChat(from)}
async function declineRequest(requestId){await api("/friends/decline",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId})});refreshState()}
setInterval(async()=>{await refreshState();if(activeFriend)await api("/dms/seen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:activeFriend})})},2500)
async function init(){backend=await getBackend();token=localStorage.getItem("Token");await trackPage("1dms.html");if(!token){location.href="login.html";return}const r=await api("/me"),me=await safeJson(r);if(!me){location.href="login.html";return}myName=me.username;await refreshState();const f=decodeURIComponent(location.hash.substring(1)).trim();if(f){const found=state.friends.find(x=>x.toLowerCase()===f.toLowerCase());if(found)openChat(found,true)}}
init()
</script>
</body>
</html>
