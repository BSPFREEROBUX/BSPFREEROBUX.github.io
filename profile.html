<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyphor Profile</title>
<script>
(function(){
    const username = localStorage.getItem("username");
    const phone = localStorage.getItem("Phone");

    if(!username){
        window.location.replace("0profile.html");
        return;
    }

    const encodedUsername = encodeURIComponent(username);

    if(phone === "1"){
        window.location.replace("1profile.html?username=" + encodedUsername);
    }else{
        window.location.replace("0profile.html?username=" + encodedUsername);
    }
})();
</script>
</head>
<body>
</body>
</html>
