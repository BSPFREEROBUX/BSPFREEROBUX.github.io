<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMS</title>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:#0f0f10;
    color:#f4f4f4;
    overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:12px 16px;
background:#151516;
border-bottom:1px solid #2a2a2a;
flex-shrink:0;
}

.topbar .left,
.topbar .right{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.btn,
.iconBtn,
.smallBtn{
border:none;
border-radius:10px;
background:#2a2a2a;
color:#fff;
cursor:pointer;
touch-action:manipulation;
}

.btn:hover,
.iconBtn:hover,
.smallBtn:hover{
background:#383838;
}

.iconBtn{
padding:10px 12px;
}

.smallBtn{
padding:7px 10px;
font-size:12px;
}

.layout{
    flex:1;
    display:grid;
    grid-template-columns:320px 1fr;
    min-height:0;
    overflow:hidden;
}

.sidebar{
display:flex;
flex-direction:column;
min-height:0;
border-right:1px solid #2a2a2a;
background:#111112;
overflow:hidden;
}

.section{
padding:14px;
border-bottom:1px solid #242424;
}

.section h3{
margin:0 0 10px 0;
font-size:15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.badge{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:22px;
height:22px;
padding:0 7px;
border-radius:999px;
background:#e53935;
color:#fff;
font-size:12px;
font-weight:700;
}

.searchRow{
display:flex;
gap:8px;
flex-wrap:wrap;
}

input,textarea{
width:100%;
border:1px solid #333;
border-radius:10px;
background:#0d0d0e;
color:#fff;
outline:none;
}

input{
padding:11px 12px;
}

textarea{
resize:none;
}

.list{
display:flex;
flex-direction:column;
gap:8px;
max-height:250px;
overflow:auto;
padding-right:4px;
}

.item{
padding:10px 12px;
border:1px solid #2a2a2a;
border-radius:12px;
background:#171718;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
cursor:pointer;
}

.item:hover{
background:#202021;
}

.item.active{
border-color:#5b78ff;
background:#1a1d2f;
}

.itemMain{
min-width:0;
display:flex;
flex-direction:column;
gap:3px;
}

.itemTitle{
font-weight:700;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.itemSub{
font-size:12px;
opacity:.68;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.itemActions{
display:flex;
align-items:center;
gap:6px;
flex-shrink:0;
}

.main{
    display:flex;
    flex-direction:column;
    min-height:0;
    height:100%;
    overflow:hidden;
}

.chatHeader{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:14px 16px;
border-bottom:1px solid #242424;
background:#131314;
flex-shrink:0;
}

.chatHeaderTitle{
display:flex;
flex-direction:column;
gap:4px;
min-width:0;
}

.chatHeaderTitle strong{
font-size:16px;
}

.chatHeaderTitle span{
font-size:12px;
opacity:.65;
}

.chatMessages{
    flex:1;
    overflow:auto;
    padding:18px;
    padding-bottom:100px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#0f0f10;
    min-height:0;
}

.msg{
max-width:min(720px,85%);
padding:10px 12px;
border-radius:14px;
border:1px solid #2a2a2a;
background:#171718;
word-break:break-word;
}

.msg.me{
align-self:flex-end;
background:#1e2744;
border-color:#30406d;
}

.msgHead{
display:flex;
align-items:center;
gap:8px;
font-size:12px;
opacity:.8;
margin-bottom:6px;
}

.msgTime{
opacity:.55;
font-size:11px;
}

.chatComposer{
    display:flex;
    gap:10px;
    padding:12px;
    border-top:1px solid #242424;
    background:#131314;
    flex-shrink:0;
}
    
.chatComposer textarea{
height:46px;
padding:12px;
line-height:1.35;
}

.chatComposer .btn{
padding:0 16px;
min-width:92px;
}

.empty{
padding:18px;
opacity:.7;
}

@media (max-width:900px){

.topbar{
flex-direction:column;
align-items:stretch;
padding:10px;
}

.topbar .left,
.topbar .right{
width:100%;
justify-content:center;
}

.layout{
display:flex;
flex-direction:column;
}

.sidebar{
height:40vh;
border-right:none;
border-bottom:1px solid #2a2a2a;
}

.main{
height:60vh;
}

.section{
padding:10px;
}

.searchRow{
flex-direction:column;
}

.searchRow input,
.searchRow button{
width:100%;
}

.list{
flex:1;
max-height:none;
overflow-y:auto;
}

.chatHeader{
flex-wrap:wrap;
padding:10px;
}

.chatMessages{
padding:10px;
}

.msg{
max-width:95%;
font-size:14px;
}

.chatComposer{
padding:8px;
}

.chatComposer textarea{
font-size:16px;
}

.iconBtn,
.btn,
.smallBtn{
min-height:42px;
font-size:14px;
}
}

@media (max-width:600px){

.sidebar{
height:35vh;
}

.main{
height:65vh;
}

.chatHeader{
flex-direction:column;
align-items:flex-start;
}

.chatHeaderTitle{
width:100%;
}

.chatComposer{
flex-direction:column;
}

.chatComposer textarea{
width:100%;
height:60px;
}

.chatComposer .btn{
width:100%;
min-height:48px;
}

.msg{
max-width:100%;
}

.item{
padding:12px;
}

.itemTitle{
font-size:15px;
}

.itemSub{
font-size:13px;
}

.badge{
min-width:24px;
height:24px;
}

/* PHONE LAYOUT */

#phoneLayout{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#111214;
    color:white;
    overflow:hidden;
}

.phoneHeader{
    height:60px;
    display:flex;
    align-items:center;
    padding:0 18px;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #2c2c2c;
}

#phoneFriends{
    flex:1;
    overflow-y:auto;
}

.phoneFriend{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px;
    cursor:pointer;
    border-bottom:1px solid #222;
}

.phoneFriend:hover{
    background:#1b1d20;
}

.phoneAvatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#5865F2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:20px;
}

.phoneInfo{
    flex:1;
    min-width:0;
}

.phoneName{
    font-size:16px;
    font-weight:bold;
}

.phoneLast{
    color:#9fa3aa;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.phoneUnread{
    background:#f23f43;
    min-width:22px;
    height:22px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
}

.phoneChatHeader{
    height:60px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 14px;
    border-bottom:1px solid #2a2a2a;
}

.phoneBackButton{
    background:none;
    border:none;
    color:white;
    font-size:24px;
    cursor:pointer;
}

#phoneChatTitle{
    font-size:18px;
    font-weight:bold;
}

#phoneMessages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:16px;
    padding-bottom:90px;
}

.phoneComposer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid #2a2a2a;
    background:#111214;
    z-index:1000;
}

.phoneComposer textarea{
    flex:1;
    height:48px;
    padding:12px 18px;
    border-radius:24px;
    font-size:16px;
    line-height:24px;
    resize:none;
}

.phoneComposer button{
    width:auto;
}

.phoneAttachButton{
    width:56px;
    height:56px;
    min-width:56px;
    min-height:56px;

    border-radius:50%;

    background:#2b2d31;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
    flex:none;
    cursor:pointer;
}

.phoneSendButton{
    width:56px;
    height:56px;
    min-width:56px;
    min-height:56px;
    max-width:56px;
    max-height:56px;

    border:none;
    border-radius:50%;

    background:#5865F2;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;
    line-height:1;

    cursor:pointer;
    flex:none;
}

.phoneImage{
    max-width:220px;
    max-height:220px;
    display:block;
    margin-top:8px;
    border-radius:12px;
    cursor:pointer;
}

.phoneRead{
    margin-top:6px;
    font-size:11px;
    opacity:.65;
    text-align:right;
}

.phoneSent{
    opacity:.4;
}

.phoneMsg{
    display:flex;
    margin-bottom:14px;
}

.phoneThem{
    justify-content:flex-start;
}

.phoneMe{
    justify-content:flex-end;
}

.phoneMsgTop{
    display:flex;
    gap:10px;
    align-items:flex-end;
}

.phoneAvatarSmall{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#5865F2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
    flex-shrink:0;
}

.phoneBubble{
    background:#2b2d31;
    padding:10px 14px;
    border-radius:18px;
    max-width:75vw;
}

.phoneMe .phoneBubble{
    background:#5865F2;
}

.phoneSender{
    margin-bottom:6px;
    font-size:12px;
    opacity:.85;
}

.phoneHeader{
    height:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.phoneHeaderTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.phoneNavButton{
    border:none;
    border-radius:10px;
    background:#2b2d31;
    color:white;
    padding:8px 14px;
    cursor:pointer;
    font-size:14px;
}

.phoneHeaderTop span{
    flex:1;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.phoneSearch{
    display:flex;
    gap:8px;
}

.phoneSearch input{
    flex:1;
}

.phoneSearch button{
    border:none;
    border-radius:10px;
    background:#5865F2;
    color:white;
    padding:0 16px;
    cursor:pointer;
}

.phoneRequestsButton{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    border:none;
    border-radius:12px;
    background:#2b2d31;
    color:white;
    cursor:pointer;
    font-size:15px;
}

#phoneRequestCount{
    background:#f23f43;
    border-radius:999px;
    min-width:22px;
    padding:3px 8px;
    text-align:center;
}

#phoneRequestList{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:10px;
}

#phoneChat{
    position:fixed;
    left:0;
    right:0;
    top:180px;
    bottom:0;
    display:flex;
    flex-direction:column;
    background:#111214;
    overflow:hidden;
}
/* PHONE LAYOUT END */
}
</style>
</head>
<body>

<div id="desktopLayout">

<div class="topbar">
<div class="left">
<button class="iconBtn" onclick="location.href='dashboard.html'">Dashboard</button>
<button class="iconBtn" onclick="location.href='Support.html'">Support</button>
</div>
<div class="right">
<span id="statusText"></span>
<button class="iconBtn" onclick="logout()">Logout</button>
</div>
</div>

<div class="layout">
<div class="sidebar">
<div class="section">
<h3>Find a user</h3>
<div class="searchRow">
<input id="searchUser" placeholder="Type a username">
<button class="btn" onclick="openFromSearch()">Chat</button>
<button class="btn" onclick="addFriendFromSearch()">Add Friend</button>
</div>
</div>

<div class="section">
<h3>Friend Requests <span class="badge" id="requestCount">0</span></h3>
<div class="list" id="requestList"></div>
</div>

<div class="section" style="flex:1;min-height:0">
<h3>Friends <span class="badge" id="friendCount">0</span></h3>
<div class="list" id="friendList"></div>
</div>
</div>

<div class="main">
<div class="chatHeader">
<div class="chatHeaderTitle">
<strong id="chatTitle">Select a friend</strong>
<span id="chatSub">Private messages</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="smallBtn" id="unfriendBtn" onclick="unfriendActive()" disabled>Unfriend</button>
<button class="smallBtn" onclick="refreshState()">Refresh</button>
</div>
</div>

<div class="chatMessages" id="chatMessages">
<div class="empty">Pick a friend to open the chat.</div>
</div>

<div class="chatComposer">

<input
type="file"
id="imagePicker"
accept="image/*"
multiple
hidden>

<label
for="imagePicker"
class="btn"
id="attachBtn">
📷 Attach
</label>

<textarea
id="messageBox"
placeholder="Message"
disabled></textarea>

<button
class="btn"
id="sendBtn"
onclick="sendMessage()"
disabled>
Send
</button>

</div>
</div>
</div>

<script>
let backend=null
let token=null
let myName=""
let state={friends:[],incomingRequests:[],outgoingRequests:[],chats:[]}
let activeFriend=""
let lastUnreadTotal=0
let firstStateLoad=true
const phoneMode = localStorage.getItem("Phone") === "1";

const requestCount=document.getElementById("requestCount")
const friendCount=document.getElementById("friendCount")
const requestList=document.getElementById("requestList")
const friendList=document.getElementById("friendList")
const chatMessages=document.getElementById("chatMessages")
const chatTitle=document.getElementById("chatTitle")
const chatSub=document.getElementById("chatSub")
const messageBox=document.getElementById("messageBox")
const sendBtn=document.getElementById("sendBtn")
const imagePicker=document.getElementById("imagePicker")
const unfriendBtn=document.getElementById("unfriendBtn")
const statusText=document.getElementById("statusText")
const attachBtn = document.getElementById("attachBtn");

const notificationSound=new Audio("Sounds/Notification.mp3")
notificationSound.preload="auto"

messageBox.addEventListener("keydown",e=>{
if(e.key==="Enter" && !e.shiftKey){
e.preventDefault()
sendMessage()
}
})

document.getElementById("searchUser").addEventListener("keydown",e=>{
if(e.key==="Enter"){
e.preventDefault()
openFromSearch()
}
})

async function trackPage(page){
const token=localStorage.getItem("Token")
if(!token) return

await fetch(backend+"/track/page",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:token
},
body:JSON.stringify({page})
})
}


function escapeHTML(value){
return String(value ?? "").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[m]))
}

function formatTime(time){
try{
return new Date(time).toLocaleString()
}catch{
return ""
}
}

async function getBackend(){
const r=await fetch("server.txt")
return (await r.text()).trim()
}

async function safeJson(res){
const t=await res.text()
try{return JSON.parse(t)}catch{return null}
}

async function api(path,options={}){
const liveToken=localStorage.getItem("Token")
if(!liveToken){
location.href="login.html"
throw new Error("unauthorized")
}

const headers=new Headers(options.headers||{})
headers.set("Authorization",liveToken)

return fetch(backend+path,{
...options,
headers
})
}

function playSound(){
notificationSound.currentTime=0
notificationSound.play().catch(()=>{})
}

function getChatSummary(friend){
return state.chats.find(c=>c.with===friend) || {unread:0,lastMessage:"",lastAuthor:""}
}

function renderRequests(){
requestCount.textContent=String(state.incomingRequests.length)
requestList.innerHTML=""

if(!state.incomingRequests.length){
requestList.innerHTML='<div class="empty">No requests.</div>'
return
}

state.incomingRequests.forEach(r=>{
const row=document.createElement("div")
row.className="item"
row.innerHTML=`
<div class="itemMain">
<div class="itemTitle">${escapeHTML(r.from)}</div>
<div class="itemSub">Wants to add you</div>
</div>
<div class="itemActions">
<button class="smallBtn" data-accept>Accept</button>
<button class="smallBtn" data-decline>Decline</button>
</div>
`
row.querySelector("[data-accept]").onclick=async e=>{
e.stopPropagation()
await acceptRequest(r.id,r.from)
}
row.querySelector("[data-decline]").onclick=async e=>{
e.stopPropagation()
await declineRequest(r.id)
}
requestList.appendChild(row)
})
const mobileList=document.getElementById("phoneRequestList");
const mobileCount=document.getElementById("phoneRequestCount");

if(phoneMode && mobileList && mobileCount){

    mobileCount.textContent=state.incomingRequests.length;

    mobileList.innerHTML="";

    state.incomingRequests.forEach(r=>{

        const div=document.createElement("div");

        div.className="phoneFriend";

        div.innerHTML=`
            <div class="phoneAvatar">
                ${r.from.charAt(0).toUpperCase()}
            </div>

            <div class="phoneInfo">
                <div class="phoneName">
                    ${escapeHTML(r.from)}
                </div>

                <div class="phoneLast">
                    Friend request
                </div>
            </div>

            <button
                class="smallBtn"
                onclick="acceptRequest('${r.id}','${r.from}')">
                ✓
            </button>

            <button
                class="smallBtn"
                onclick="declineRequest('${r.id}')">
                ✕
            </button>
        `;

        mobileList.appendChild(div);

    });

}

}

function togglePhoneRequests(){

    const list=document.getElementById("phoneRequestList");

    if(!list) return;

    list.style.display =
        list.style.display==="flex"
        ? "none"
        : "flex";

}

function renderFriends(){
friendCount.textContent=String(state.friends.length)
friendList.innerHTML=""

const phoneFriends = document.getElementById("phoneFriends");

if(phoneMode){
    phoneFriends.innerHTML = "";
}

if(!state.friends.length){
friendList.innerHTML='<div class="empty">No friends yet.</div>'
return
}

const sorted=[...state.friends].sort((a,b)=>{
const aa=getChatSummary(a)
const bb=getChatSummary(b)
if((bb.unread||0)!==(aa.unread||0)) return (bb.unread||0)-(aa.unread||0)
return a.localeCompare(b)
})

sorted.forEach(friend=>{
const summary=getChatSummary(friend)
const row=document.createElement("div")
row.className="item"+(activeFriend===friend ? " active" : "")
row.innerHTML=`
<div class="itemMain">
<div class="itemTitle">${escapeHTML(friend)}</div>
<div class="itemSub">${escapeHTML(summary.lastAuthor ? `${summary.lastAuthor}: ${summary.lastMessage}` : "No messages yet")}</div>
</div>
<div class="itemActions">
${summary.unread>0 ? `<span class="badge">${summary.unread}</span>` : ""}
</div>
`
row.onclick=()=>openChat(friend)
friendList.appendChild(row)

if(phoneMode){

    const mobile=document.createElement("div");
    mobile.className="phoneFriend";

    mobile.innerHTML=`
        <div class="phoneAvatar">
            ${friend.charAt(0).toUpperCase()}
        </div>

        <div class="phoneInfo">
            <div class="phoneName">${escapeHTML(friend)}</div>
            <div class="phoneLast">
                ${escapeHTML(summary.lastAuthor ? `${summary.lastAuthor}: ${summary.lastMessage}` : "No messages yet")}
            </div>
        </div>

        ${
            summary.unread>0
            ? `<div class="phoneUnread">${summary.unread}</div>`
            : ""
        }
    `;

    mobile.onclick=()=>openChat(friend);

    phoneFriends.appendChild(mobile);

}

})
}

function closePhoneChat(){

    document.getElementById("phoneChat").style.display="none";
    document.getElementById("phoneFriends").style.display="block";

}

function renderActiveChat(chat){

if(!chat){
chatTitle.textContent="Select a friend"
chatSub.textContent="Private messages"
chatMessages.innerHTML='<div class="empty">Pick a friend to open the chat.</div>'

messageBox.disabled=true
sendBtn.disabled=true

const phoneBox=document.getElementById("phoneMessageBox");

if(phoneMode){
    phoneBox.disabled=true;
    phoneBox.value="";
}

imagePicker.disabled=true
attachBtn.style.pointerEvents="none"
attachBtn.style.opacity="0.5"

unfriendBtn.disabled=true
messageBox.value=""
imagePicker.value=""

return
}

chatTitle.textContent=chat.with
chatSub.textContent=`${chat.messages.length} messages`

messageBox.disabled=false
sendBtn.disabled=false

const phoneBox=document.getElementById("phoneMessageBox");

if(phoneMode){
    phoneBox.disabled=false;
}

imagePicker.disabled=false
attachBtn.style.pointerEvents="auto"
attachBtn.style.opacity="1"

unfriendBtn.disabled=false

if(!chat.messages.length){
chatMessages.innerHTML='<div class="empty">No messages yet.</div>'
return
}

const phoneMessages=document.getElementById("phoneMessages");

if(phoneMode){
    phoneMessages.innerHTML="";
}

chatMessages.innerHTML=chat.messages.map(m=>{
const me=m.author===myName
return `
<div class="msg ${me ? "me" : ""}">
<div class="msgHead">
<strong>${escapeHTML(m.author)}</strong>
<span class="msgTime">${escapeHTML(formatTime(m.time))}</span>
</div>
<div>${escapeHTML(m.text)}</div>

${
(m.images||[]).map(img=>`
<img
src="${backend}${img.url}"
style="
max-width:300px;
max-height:300px;
display:block;
margin-top:8px;
border-radius:10px;
cursor:pointer;
"
onclick="window.open('${backend}${img.url}','_blank')">
`).join("")
if (wasNearBottom) {
    chatMessages.scrollTop = chatMessages.scrollHeight;
} else {
    chatMessages.scrollTop = previousScroll;
}
}
${me ? (() => {
const other = chat.users.find(u => u !== myName)
const readTime = chat.lastRead?.[other]

if(readTime && new Date(readTime) >= new Date(m.time)){
return `<div style="font-size:11px;opacity:.6;margin-top:4px">✓ Read</div>`
}

return `<div style="font-size:11px;opacity:.4;margin-top:4px">✓ Sent</div>`
})() : ""}
</div>
`
}).join("")

if(phoneMode){

    chat.messages.forEach(m=>{

        const div=document.createElement("div");

        div.className =
    "phoneMsg " +
    (m.author===myName ? "phoneMe" : "phoneThem");

        div.innerHTML=`
<div class="phoneMsgTop">

    ${
        m.author===myName
        ? ""
        : `<div class="phoneAvatarSmall">
                ${m.author.charAt(0).toUpperCase()}
           </div>`
    }

    <div class="phoneBubble">

        <div class="phoneSender">

            <strong>${escapeHTML(m.author)}</strong>

            <span class="msgTime">
                ${escapeHTML(formatTime(m.time))}
            </span>

        </div>

            <div>${escapeHTML(m.text)}</div>

${
    (m.images||[]).map(img=>`
        <img
            src="${backend}${img.url}"
            class="phoneImage"
            onclick="window.open('${backend}${img.url}','_blank')">
    `).join("")
}

${
    m.author===myName
    ? (()=>{

        const other=chat.users.find(u=>u!==myName);
        const readTime=chat.lastRead?.[other];

        if(readTime && new Date(readTime)>=new Date(m.time)){
            return `<div class="phoneRead">✓ Read</div>`;
        }

        return `<div class="phoneRead phoneSent">✓ Sent</div>`;

    })()
    : ""
}
        `;

        phoneMessages.appendChild(div);

    });

    phoneMessages.scrollTop=phoneMessages.scrollHeight;

}

const nearBottom =
chatMessages.scrollHeight -
chatMessages.scrollTop -
chatMessages.clientHeight < 150

if(nearBottom){
chatMessages.scrollTop = chatMessages.scrollHeight
}
}

async function refreshState(){
const r=await api("/dms/state")
const data=await safeJson(r)

if(!data || data.error){
if(data && data.error==="unauthorized") location.href="login.html"
return
}

state=data
statusText.textContent=`Logged in as ${myName}`

const totalUnread=(state.unreadMessages||0)+(state.unreadRequests||0)
if(!firstStateLoad && totalUnread>lastUnreadTotal){
playSound()
}
firstStateLoad=false
lastUnreadTotal=totalUnread

renderRequests()
renderFriends()

if(activeFriend){
await refreshActiveChat(false)
}else{
renderActiveChat(null)
}
}

async function refreshActiveChat(markSeenNow=true){
if(!activeFriend) return

const r=await api("/dms/chat?with="+encodeURIComponent(activeFriend))
const data=await safeJson(r)

if(!data){
return
}

if(data.error==="notfriends"){
renderActiveChat(null)
activeFriend=""
await refreshState()
return
}

if(data.error){
return
}

renderActiveChat(data.chat)

if(markSeenNow){
await api("/dms/seen",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chatId:activeFriend})
})
}
}

async function openChat(friend){
const r=await api("/dms/chat?with="+encodeURIComponent(friend))
const data=await safeJson(r)

if(data && data.error==="notfound"){
alert("User not found")
return
}

if(data && data.error==="notfriends"){
alert("You need to be friends first")
return
}

if(data && data.error){
alert(data.error)
return
}

activeFriend=friend

if(phoneMode){

    document.getElementById("phoneFriends").style.display="none";

    document.getElementById("phoneChat").style.display="flex";

    document.getElementById("phoneChat").style.flexDirection="column";

    document.getElementById("phoneChatTitle").textContent=friend;

}

location.hash=encodeURIComponent(friend)

await api("/dms/activity",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chatId:activeFriend,
active:true
})
})

renderActiveChat(data.chat)
await api("/dms/seen",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chatId:activeFriend})
})
await refreshState()
}

async function openFromSearch(){
const name=document.getElementById("searchUser").value.trim()
if(!name) return
await openChat(name)
}

async function addFriendFromSearch(){
const name=document.getElementById("searchUser").value.trim()
if(!name){
alert("Enter a username")
return
}

const r=await api("/friends/request",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:name
})
})

const data=await safeJson(r)

if(!data){
alert("Server error")
return
}

if(data.success){
alert("Friend request sent")
await refreshState()
return
}

if(data.error==="notfound"){
alert("User not found")
}else if(data.error==="self"){
alert("You cannot add yourself")
}else if(data.error==="friends"){
alert("You are already friends")
}else if(data.error==="pending"){
alert("Friend request already exists")
}else{
alert(data.error)
}
}

async function openPhoneSearch(){

    const input=document.getElementById("phoneSearchUser");

    document.getElementById("searchUser").value=input.value;

    await openFromSearch();

}

async function addPhoneFriend(){

    const input=document.getElementById("phoneSearchUser");

    document.getElementById("searchUser").value=input.value;

    await addFriendFromSearch();

}

async function requestFriend(username){
const r=await api("/friends/request",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username})
})

const data=await safeJson(r)

if(!data) return

if(data.error==="unauthorized"){
location.href="login.html"
return
}

if(data.error==="notfound") alert("User not found")
else if(data.error==="self") alert("You cannot add yourself")
else if(data.error==="friends") alert("Already friends")
else if(data.error==="pending") alert("Friend request already exists")
else if(data.success) alert("Friend request sent")

await refreshState()
}

async function acceptRequest(requestId,from){
const r=await api("/friends/accept",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({requestId})
})
const data=await safeJson(r)
if(!data || data.error) return
await refreshState()
await openChat(from)
}

async function declineRequest(requestId){
await api("/friends/decline",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({requestId})
})
await refreshState()
}

async function sendPhoneMessage(){

    const box=document.getElementById("phoneMessageBox");
    const phonePicker=document.getElementById("phoneImagePicker");

    messageBox.value=box.value;

    imagePicker.files=phonePicker.files;

    await sendMessage();

    box.value="";
    phonePicker.value="";

}

async function sendMessage(){

if(!activeFriend) return

const text=messageBox.value.trim()
if(
!text &&
imagePicker.files.length===0
){
return
}

const form=new FormData()

form.append("chatId",activeFriend)
form.append("message",text)

for(const file of imagePicker.files){
form.append("images",file)
}

const r=await api("/dms/send",{
method:"POST",
body:form
})

const data=await safeJson(r)

if(data && data.error){
alert(data.error)
return
}

messageBox.value=""
imagePicker.value=""

await refreshActiveChat(false)
await refreshState()

}

async function unfriendActive(){
if(!activeFriend) return
if(!confirm("Unfriend "+activeFriend+"?")) return
await api("/friends/remove",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:activeFriend})
})
activeFriend=""
location.hash=""
renderActiveChat(null)
await refreshState()
}

function logout(){
localStorage.removeItem("Token")
location.href="login.html"
}

window.addEventListener("beforeunload",()=>{

if(!activeFriend) return

navigator.sendBeacon(
backend+"/dms/activity",
new Blob([
JSON.stringify({
chatId:activeFriend,
active:false,
token:localStorage.getItem("Token")
})
],{
type:"application/json"
})
)

})


document.addEventListener("visibilitychange",()=>{

if(!activeFriend) return


api("/dms/activity",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chatId:activeFriend,
active:!document.hidden
})
})


})

async function init(){
backend=await getBackend()
token=localStorage.getItem("Token")
await trackPage("DMS.html")
if(!token){
location.href="login.html"
return
}

const meRes=await api("/me")
const me=await safeJson(meRes)

if(!me || me.error){
location.href="login.html"
return
}

myName=me.username
statusText.textContent=`Logged in as ${myName}`

if(phoneMode){
    document.getElementById("desktopLayout").style.display="none";
    document.getElementById("phoneLayout").style.display="block";
}

if(location.hash){
const wanted=decodeURIComponent(location.hash.slice(1))
if(wanted) activeFriend=wanted
}

await refreshState()

setInterval(async ()=>{
    await refreshState()

    if(activeFriend){
        await api("/dms/seen",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({chatId:activeFriend})
        })
    }
},2500)

window.addEventListener("hashchange",()=>{
const wanted=decodeURIComponent(location.hash.slice(1))
if(wanted && wanted!==activeFriend){
openChat(wanted)
}
})
}

init()
</script>
