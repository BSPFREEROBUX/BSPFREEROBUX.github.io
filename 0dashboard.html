<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
</head>
<body>

<div id="content"></div>

<script>
async function loadDashboard(){
    try{
        const serverResponse=await fetch("/server.txt",{cache:"no-store"})

        if(!serverResponse.ok){
            throw new Error("Failed to load server.txt")
        }

        const backendUrl=(await serverResponse.text()).trim().replace(/\/+$/,"")

        if(!backendUrl){
            throw new Error("No backend URL")
        }

        const response=await fetch(`${backendUrl}/url/0dashboard`,{
            method:"GET"
        })

        if(!response.ok){
            throw new Error("Failed to load dashboard")
        }

        const html=await response.text()

        document.getElementById("content").innerHTML=html
    }catch(err){
        document.getElementById("content").innerText="Failed to load dashboard"
    }
}

loadDashboard()
</script>

</body>
</html>
